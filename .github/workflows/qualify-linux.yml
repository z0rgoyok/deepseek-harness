name: Qualify DeepSeek Harness Linux runtime

# This workflow belongs on the isolated, orphan CI branch only. The application
# source is checked out independently at the exact PR head below.
on:
  push:
    branches:
      - ci/deepseek-linux-qualification

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'z0rgoyok/deepseek-harness' && github.ref == 'refs/heads/ci/deepseek-linux-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      DSH_TELEMETRY_DISABLED: '1'
      DSH_TELEMETRY_MODE: DISABLED
      SOURCE_COMMIT: 76b0743e339d78e24680db39747b81e101d2c236
    steps:
      - name: Checkout isolated qualification driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: driver
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout fixed fork source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: z0rgoyok/deepseek-harness
          ref: 76b0743e339d78e24680db39747b81e101d2c236
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and create owned staging
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$(git remote get-url origin)" in
            https://github.com/z0rgoyok/deepseek-harness|https://github.com/z0rgoyok/deepseek-harness.git) ;;
            *) echo 'Unexpected source remote' >&2; exit 1 ;;
          esac
          echo '349ecef16eae1c2166b74661fdff552b9825945894b89461b3a29f825daa6f76  pnpm-lock.yaml' | sha256sum -c -
          test "$(uname -m)" = 'x86_64'
          root=$(mktemp -d "$RUNNER_TEMP/dsh-qualification.XXXXXXXX")
          echo "DSH_CI_ROOT=$root" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$root/store" >> "$GITHUB_ENV"
          chmod 700 "$root"
          mkdir -m 700 "$root/stage" "$root/artifact" "$root/store"
          df -h "$RUNNER_TEMP"

      - name: Install verified Node.js and pnpm into staging
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://nodejs.org/dist/v26.12.1/node-v26.12.1-linux-x64.tar.xz -o "$DSH_CI_ROOT/node.tar.xz"
          echo "6170b2d474e1c626f43cff3adc118df9fe3b573258a4fc3d850c8dbc6b079bbd  $DSH_CI_ROOT/node.tar.xz" | sha256sum -c -
          mkdir -m 700 "$DSH_CI_ROOT/node" "$DSH_CI_ROOT/pnpm" "$DSH_CI_ROOT/bin"
          tar -xJf "$DSH_CI_ROOT/node.tar.xz" --strip-components=1 -C "$DSH_CI_ROOT/node"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://registry.npmjs.org/pnpm/-/pnpm-11.28.5.tgz -o "$DSH_CI_ROOT/pnpm.tgz"
          python3 - "$DSH_CI_ROOT/pnpm.tgz" <<'PY'
          import base64, hashlib, sys
          from pathlib import Path
          actual = base64.b64encode(hashlib.sha512(Path(sys.argv[1]).read_bytes()).digest()).decode()
          if actual != 'SEVj0wtMKtJ8tIqpT/KzAtvOvI/2vyiBbCWJiG4UbOf3bzVPO8GkOOb16XaMMCqgpvet2CMpA81M+BQmy8FNng==':
              raise SystemExit('pnpm archive integrity differs')
          PY
          tar -xzf "$DSH_CI_ROOT/pnpm.tgz" --strip-components=1 -C "$DSH_CI_ROOT/pnpm"
          ln -s "$DSH_CI_ROOT/pnpm/bin/pnpm.mjs" "$DSH_CI_ROOT/bin/pnpm"
          echo "$DSH_CI_ROOT/node/bin" >> "$GITHUB_PATH"
          echo "$DSH_CI_ROOT/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        working-directory: source
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v26.12.1'
          test "$(pnpm --version)" = '11.28.5'
          pnpm install --frozen-lockfile --ignore-scripts --store-dir "$DSH_CI_ROOT/store"

      - name: Build native addon and host libraries
        working-directory: source
        run: |
          set -euo pipefail
          pnpm run build:native-system
          pnpm exec tsx scripts/compile-referenced-projects.ts host-libraries

      - name: Prepare and materialize runtime closure
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter dsh-python-runtime-closure deploy --prod --legacy --ignore-scripts \
            --config.allow-unused-patches=true --config.node-linker=hoisted \
            --config.auto-install-peers=false --config.link-workspace-packages=true \
            --config.hoist-workspace-packages=false "$DSH_CI_ROOT/stage"
          pnpm exec tsx "$GITHUB_WORKSPACE/driver/ci/materialize.mts" "$PWD" "$DSH_CI_ROOT/stage"

      - name: Load and exercise packaged native addon
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$DSH_CI_ROOT/stage" "$DSH_CI_ROOT" <<'NODE'
          import {openSync, closeSync, unlinkSync} from 'node:fs'
          import {join} from 'node:path'
          import {pathToFileURL} from 'node:url'
          const stage = process.argv[2]
          const path = join(process.argv[3], 'native-lock-check')
          const entry = join(stage, 'node_modules/@deepseek-ai/node-addon-system/lib/flock.js')
          const {tryLockExclusive} = await import(pathToFileURL(entry).href)
          const fd = openSync(path, 'wx', 0o600)
          try { await tryLockExclusive(fd) } finally { closeSync(fd); unlinkSync(path) }
          process.stdout.write('NATIVE_FLOCK_OK\n')
          NODE

      - name: Qualify packaged ACP with loopback synthetic peers
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/driver/ci/privacy.patch.yml" "$DSH_CI_ROOT/qualification-policy.yml"
          chmod 400 "$DSH_CI_ROOT/qualification-policy.yml"
          echo "4482da18064697ce24688fb04123ac882605d66eb510f5b74ef2979d3e4344f7  $DSH_CI_ROOT/qualification-policy.yml" | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/driver/ci/qualify_acp.py" "$DSH_CI_ROOT/stage" "$DSH_CI_ROOT/qualification-policy.yml"

      - name: Build archive, manifest and run-bound provenance
        run: python3 "$GITHUB_WORKSPACE/driver/ci/artifact.py" "$GITHUB_WORKSPACE/source" "$DSH_CI_ROOT/stage" "$DSH_CI_ROOT/artifact" "$DSH_CI_ROOT/qualification-policy.yml"

      - name: Publish qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-linux-x86_64-76b0743e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DSH_CI_ROOT }}/artifact/runtime.tar
            ${{ env.DSH_CI_ROOT }}/artifact/manifest.jsonl
            ${{ env.DSH_CI_ROOT }}/artifact/provenance.json
            ${{ env.DSH_CI_ROOT }}/artifact/qualification-policy.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove owned staging and dependency store
        if: always() && env.DSH_CI_ROOT != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          root = Path(os.environ['DSH_CI_ROOT']).resolve(strict=True)
          parent = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if root.parent != parent or not root.name.startswith('dsh-qualification.'):
              raise SystemExit('refusing unexpected cleanup target')
          shutil.rmtree(root)
          PY
